name = "rog-cloudflare-enterprise-ai"
main = "worker/src/index.ts"
compatibility_date = "2026-10-21"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "rog-enterprise-documents"

[[d1_databases]]
binding = "DB"
database_name = "rog-enterprise-db"
database_id = "3e50b6d4-370a-493b-8ac4-bd4b2b59e42a"
migrations_dir = "migrations"

[[vectorize]]
binding = "VECTORIZE"
index_name = "rog-enterprise-vectors-multilingual"

[[queues.producers]]
binding = "INDEX_QUEUE"
queue = "rog-document-indexing"

[[queues.consumers]]
queue = "rog-document-indexing"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[vars]
EMBEDDING_MODEL = "@cf/baai/bge-m3"
GENERATION_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
