name = "rog-cloudflare-enterprise-ai"
main = "worker/src/index.ts"
compatibility_date = "2026-10-21"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "rog-enterprise-documents"

[[d1_databases]]
binding = "DB"
database_name = "rog-enterprise-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[vectorize]]
binding = "VECTORIZE"
index_name = "rog-enterprise-vectors"

[[queues.producers]]
binding = "INDEX_QUEUE"
queue = "rog-document-indexing"

[[queues.consumers]]
queue = "rog-document-indexing"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[vars]
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
GENERATION_MODEL = "@cf/meta/llama-3.1-8b-instruct"
